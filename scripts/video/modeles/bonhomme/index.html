<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="lib/gsap.min.js"></script>
    <style>
      @font-face { font-family: InterL; font-weight: 500; src: url(fonts/inter-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family: InterL; font-weight: 700; src: url(fonts/inter-latin-700-normal.woff2) format("woff2"); }
      @font-face { font-family: Anton; src: url(fonts/anton-latin-400-normal.woff2) format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; background: #000; color: #fff; font-family: InterL, sans-serif; }
      #warm { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 52%, rgba(255,196,0,.16), transparent 70%); opacity: 0; }
      svg { position: absolute; inset: 0; }
      .q { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font: 500 56px InterL; }
      .q b { color: #ffc400; font-weight: 700; }
      #end { position: absolute; left: 0; right: 0; bottom: 170px; text-align: center; }
      #end .b { font: 400 44px Anton; letter-spacing: .32em; }
      #end .b b { color: #ffc400; font-weight: 400; }
      #end .s { margin-top: 14px; font: 500 30px InterL; color: rgba(255,255,255,.75); }
      .ln { fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; }
      .bub text { font: 700 34px InterL; text-anchor: middle; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">
      <div id="warm"></div>
      <div class="q" id="q1">Une pièce nue. Un plafond triste.</div>
      <div class="q" id="q2">Un message à <b>UniC</b>…</div>
      <div class="q" id="q3">…et le plafond prend vie.</div>
      <svg viewBox="0 0 1080 1920">
        <defs>
          <filter id="blur" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="12" /></filter>
          <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffc400" stop-opacity=".45" /><stop offset="1" stop-color="#ffc400" stop-opacity="0" />
          </linearGradient>
        </defs>
        <!-- la pièce, vue de face ; une porte à droite pour le plaquiste -->
        <path id="walls" class="ln" d="M80 1450 L80 650 L1000 650 L1000 900" stroke-width="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
        <path id="floor" class="ln" d="M40 1450 L1040 1450" stroke-width="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
        <g id="bulb"><line class="ln" x1="540" y1="650" x2="540" y2="752" stroke-width="4" /><circle cx="540" cy="772" r="20" fill="#3a3a3a" stroke="#fff" stroke-width="4" /></g>
        <!-- le nouveau plafond : faux plafond, LED, spots -->
        <g id="cones" opacity="0">
          <polygon points="285,734 315,734 400,1446 200,1446" fill="url(#cone)" />
          <polygon points="525,734 555,734 640,1446 440,1446" fill="url(#cone)" />
          <polygon points="765,734 795,734 880,1446 680,1446" fill="url(#cone)" />
        </g>
        <line id="ledGlow" x1="130" y1="736" x2="950" y2="736" stroke="#ffc400" stroke-width="18" filter="url(#blur)" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
        <line id="led" x1="130" y1="736" x2="950" y2="736" stroke="#ffd84d" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
        <g id="spots" opacity="0"><circle cx="300" cy="730" r="9" fill="#fff6d0" /><circle cx="540" cy="730" r="9" fill="#fff6d0" /><circle cx="780" cy="730" r="9" fill="#fff6d0" /></g>
        <!-- le client -->
        <g transform="translate(300 1450) scale(2.2)"><g id="client" class="ln" stroke-width="3.2">
          <line class="legL" x1="0" y1="-95" x2="0" y2="0" /><line class="legR" x1="0" y1="-95" x2="0" y2="0" />
          <line x1="0" y1="-95" x2="0" y2="-175" />
          <circle cx="0" cy="-203" r="24" />
          <line class="armL" x1="0" y1="-165" x2="0" y2="-85" />
          <g class="armR"><line x1="0" y1="-165" x2="0" y2="-85" /><rect id="phone" x="-8" y="-100" width="16" height="27" rx="3" fill="#ffc400" stroke="none" opacity="0" /></g>
        </g></g>
        <text id="qm" x="372" y="900" fill="#ffc400" style="font: 400 96px Anton" opacity="0">?</text>
        <g id="bub1" class="bub" opacity="0"><rect x="450" y="850" width="230" height="84" rx="42" fill="#fff" /><text x="565" y="904" fill="#000">Devis ?</text></g>
        <g id="bub2" class="bub" opacity="0"><rect x="560" y="960" width="380" height="84" rx="42" fill="#ffc400" /><text x="750" y="1014" fill="#000">Gratuit, sous 48 h</text></g>
        <!-- le plaquiste (casque) et sa plaque -->
        <g id="worker"><g transform="translate(0 1450) scale(2.2)"><g class="ln" stroke-width="3.2">
          <line class="legL" x1="0" y1="-95" x2="0" y2="0" /><line class="legR" x1="0" y1="-95" x2="0" y2="0" />
          <line x1="0" y1="-95" x2="0" y2="-175" />
          <circle cx="0" cy="-203" r="24" />
          <path d="M-28 -210 A28 28 0 0 1 28 -210 Z" fill="#ffc400" stroke="#ffc400" />
          <line class="armL" x1="0" y1="-165" x2="0" y2="-85" /><line class="armR" x1="0" y1="-165" x2="0" y2="-85" />
        </g></g></g>
        <g id="boardG"><rect id="board" x="-100" y="1040" width="18" height="330" fill="#000" stroke="#fff" stroke-width="5" /></g>
      </svg>
      <div id="end"><div class="b">UNIC <b>PLAQUISTE</b></div><div class="s">Devis gratuit sous 48 h</div></div>
    </div>
    <script>
      const R = (sel, deg) => gsap.set(sel, { rotation: deg, transformOrigin: "50% 0%" });
      // pose de repos : bras un peu ouverts, jambes écartées ; le plaquiste porte la plaque debout, à côté de lui
      R("#client .armL", 18); R("#client .armR", -18); R("#client .legL", 12); R("#client .legR", -12);
      R("#worker .armL", 30); R("#worker .armR", -18); R("#worker .legL", 12); R("#worker .legR", -12);
      gsap.set(["#worker", "#boardG"], { x: 1300 });

      const tl = gsap.timeline({ paused: true });
      const rot = (sel, deg, at, d = 0.4, ease = "power2.inOut") => tl.to(sel, { rotation: deg, duration: d, ease }, at);
      // 1. la pièce nue
      tl.to(["#walls", "#floor"], { attr: { "stroke-dashoffset": 0 }, duration: 1.2, ease: "power2.inOut" }, 0.2)
        .fromTo("#q1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.4)
        .fromTo("#bulb", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.2)
        .fromTo("#client", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.3)
        .fromTo("#qm", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(3)" }, 2.1)
        .to("#qm", { opacity: 0, duration: 0.3 }, 3.4)
        .to("#q1", { opacity: 0, duration: 0.4 }, 3.4);
      // 2. un message : le client lève son téléphone, UniC répond
      rot("#client .armR", -130, 3.7, 0.5);
      tl.to("#phone", { opacity: 1, duration: 0.2 }, 3.9)
        .fromTo("#q2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 3.8)
        .fromTo("#bub1", { opacity: 0, scale: 0.6, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 4.3)
        .fromTo("#bub2", { opacity: 0, scale: 0.6, transformOrigin: "100% 0%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 5.1)
        .to(["#bub1", "#bub2", "#phone"], { opacity: 0, duration: 0.3 }, 6.3);
      rot("#client .armR", -18, 6.4, 0.4);
      // le plaquiste arrive à pied avec sa plaque
      tl.to(["#worker", "#boardG"], { x: 760, duration: 1.6, ease: "power1.inOut" }, 5.7)
        .fromTo("#worker .legL", { rotation: 22 }, { rotation: -22, duration: 0.2, repeat: 7, yoyo: true, ease: "sine.inOut" }, 5.7)
        .fromTo("#worker .legR", { rotation: -22 }, { rotation: 22, duration: 0.2, repeat: 7, yoyo: true, ease: "sine.inOut" }, 5.7);
      rot("#worker .legL", 12, 7.3, 0.2); rot("#worker .legR", -12, 7.3, 0.2);
      tl.to("#q2", { opacity: 0, duration: 0.4 }, 7.2);
      // 3. la plaque monte et devient le faux plafond ; la LED fait le tour, les spots s'allument
      tl.to("#boardG", { x: 0, duration: 0.9, ease: "power3.inOut" }, 7.6)
        .to("#board", { attr: { x: 120, y: 650, width: 840, height: 76 }, duration: 0.9, ease: "power3.inOut" }, 7.6)
        .to("#bulb", { opacity: 0, duration: 0.3 }, 7.6);
      rot("#worker .armL", 18, 7.6, 0.4); rot("#worker .armR", -135, 7.6, 0.4, "back.out(2)"); rot("#worker .armR", -18, 8.8, 0.5);
      tl.to(["#led", "#ledGlow"], { attr: { "stroke-dashoffset": 0 }, duration: 0.9, ease: "power2.inOut" }, 8.5)
        .to("#warm", { opacity: 1, duration: 1.2 }, 8.7)
        .to("#spots", { opacity: 1, duration: 0.2 }, 9.3)
        .to("#cones", { opacity: 1, duration: 0.6 }, 9.3)
        .fromTo("#q3", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 8.6);
      // le client saute de joie
      rot("#client .armL", 135, 9.4, 0.35, "back.out(2)"); rot("#client .armR", -135, 9.4, 0.35, "back.out(2)");
      tl.to("#client", { y: -16, duration: 0.22, yoyo: true, repeat: 3, ease: "power2.out" }, 9.5)
        .fromTo("#end", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 10.1)
        .to({}, { duration: 0.01 }, 11.99);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
