<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&family=Special+Elite&display=block">
<style>
/* Thèmes : couleur de fond (--royal), texte (--fg), accent (--gold), nuances (--soft), halos (--g1, --g2), cartes de chiffres (--cardbg/--cardfg) */
:root,[data-theme="unic"]{--royal:#02083a;--fg:#fff;--soft:#ffefa3;--gold:#ffc400;--g1:#14307f;--g2:#3a2d00;--cardbg:#ffefa3;--cardfg:#02083a;--u:calc(min(100vw,100vh)/360)}
[data-theme="night"]{--royal:#05060a;--fg:#f2f4f8;--soft:#cfeaff;--gold:#5ad1ff;--g1:#12304a;--g2:#2a1245;--cardbg:#cfeaff;--cardfg:#05060a}
[data-theme="light"]{--royal:#f6f1e7;--fg:#1a1814;--soft:#6b4a2e;--gold:#b8612e;--g1:#ffffff;--g2:#ecd9b8;--cardbg:#1a1814;--cardfg:#f6f1e7}
[data-theme="earth"]{--royal:#10231a;--fg:#f4efe0;--soft:#cfe3b8;--gold:#e9b44c;--g1:#1f5a3a;--g2:#5a3a12;--cardbg:#cfe3b8;--cardfg:#10231a}
[data-theme="ocean"]{--royal:#04202e;--fg:#eefbff;--soft:#bfeeee;--gold:#35d0c4;--g1:#0d5a7a;--g2:#0a2a55;--cardbg:#bfeeee;--cardfg:#04202e}
[data-theme="sunset"]{--royal:#2a0f1f;--fg:#fff5ee;--soft:#ffd2b8;--gold:#ff8a4c;--g1:#6a1f3a;--g2:#7a3a10;--cardbg:#ffd2b8;--cardfg:#2a0f1f}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:var(--royal)}
*{box-sizing:border-box}
#root{position:absolute;inset:0;overflow:hidden;font-family:Barlow,sans-serif;color:var(--fg)}
#bg{position:absolute;inset:-10%;background:radial-gradient(60% 50% at 30% 20%,var(--g1) 0,transparent 70%),radial-gradient(50% 50% at 80% 90%,var(--g2) 0,transparent 70%),var(--royal)}
#sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(var(--u)*24)}
.an{font-family:Anton,Impact,sans-serif;letter-spacing:.02em;line-height:1.02}
.cd{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase}
.gold{color:var(--gold)} .soft{color:var(--soft)}
.row{display:flex;overflow:hidden;white-space:nowrap;justify-content:center}
.row span{display:inline-block;white-space:pre}
.ln{height:calc(var(--u)*2);width:calc(var(--u)*220);background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#sweep{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.2) 50%,transparent 65%);mix-blend-mode:screen;pointer-events:none}
/* texte */
.tx{align-items:flex-start;text-align:left;max-width:calc(var(--u)*560);width:100%}
.tx h2{font-size:calc(var(--u)*40);color:var(--gold);margin:0 0 calc(var(--u)*18);text-wrap:balance}
.bl{display:flex;gap:calc(var(--u)*12);align-items:flex-start;font-size:calc(var(--u)*19);font-weight:600;line-height:1.3;margin:calc(var(--u)*9) 0}
.bl span{text-wrap:pretty}
.bl i{flex:none;width:calc(var(--u)*10);height:calc(var(--u)*10);margin-top:calc(var(--u)*7);border-radius:50%;background:var(--gold)}
/* photo */
.ph{position:absolute;inset:0;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.shade{z-index:50;position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,color-mix(in srgb,var(--royal) 82%,transparent))}
.cap{z-index:51;position:absolute;left:calc(var(--u)*18);right:calc(var(--u)*18);bottom:calc(var(--u)*34);display:flex}
.cap span{display:inline-block;max-width:100%;text-wrap:balance;color:var(--fg);background:color-mix(in srgb,var(--royal) 92%,transparent);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:calc(var(--u)*14);padding:calc(var(--u)*10) calc(var(--u)*16);
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:calc(var(--u)*19);letter-spacing:.1em;text-transform:uppercase}
/* chiffres */
.gr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(var(--u)*14);width:100%;max-width:calc(var(--u)*520)}
.cd2{min-width:0;background:var(--cardbg);color:var(--cardfg);border-radius:calc(var(--u)*18);padding:calc(var(--u)*18) calc(var(--u)*12);text-align:center}
.cd2 b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:calc(var(--u)*50);line-height:1}
.cd2 small{display:block;margin-top:calc(var(--u)*6);font-weight:600;font-size:calc(var(--u)*14);text-wrap:balance}
.gr .cd2:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - var(--u)*7)}
/* citation */
.qm{font-family:Anton,Impact,sans-serif;font-size:calc(var(--u)*120);line-height:.7;color:var(--gold)}
.qt{font-size:calc(var(--u)*23);font-weight:600;line-height:1.35;max-width:calc(var(--u)*520);text-wrap:balance}
.fit{display:flex;flex-direction:column;align-items:center;max-width:100%}
.qa{margin-top:calc(var(--u)*18);font-size:calc(var(--u)*15);letter-spacing:.14em;color:var(--soft)}
/* fin */
.e1{font-size:calc(var(--u)*58);color:var(--gold)} .e2{font-size:calc(var(--u)*30)}
.e1,.e2,.e3,.e5,.e6{text-wrap:balance;max-width:100%}
.e3{font-size:calc(var(--u)*13);letter-spacing:.16em;color:var(--soft)}
.e4{font-size:calc(var(--u)*19);letter-spacing:.1em;color:var(--royal);background:var(--gold);padding:calc(var(--u)*12) calc(var(--u)*22);border-radius:999px}
.e5{font-size:calc(var(--u)*22);font-weight:600;letter-spacing:.04em}
.e6{font-size:calc(var(--u)*15);font-weight:500;color:var(--soft);opacity:.85}
/* effets cinéma : fond photo (+ points), machine à écrire, titre animé (dernier mot en or), liste cochée sur verre, néon, carte slogan */
.fxbg{position:absolute;inset:0;overflow:hidden}
.fxbg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.fxbg .dots{-webkit-mask-repeat:repeat;mask-repeat:repeat}
.fxshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.38) 0,transparent 26%,transparent 50%,rgba(0,0,0,.62) 100%)}
.fxbox{position:absolute;left:calc(var(--u)*20);right:calc(var(--u)*20);display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.tw{font-family:"Special Elite",monospace;color:var(--fg);text-shadow:0 2px 10px rgba(0,0,0,.6);white-space:pre-wrap;line-height:1.3}
.tw .cur{display:inline-block;width:.12em;height:1em;margin-left:.06em;vertical-align:-.1em;background:var(--gold)}
.tag{display:flex;align-items:center;overflow:hidden;margin-bottom:calc(var(--u)*8);border-radius:calc(var(--u)*5);white-space:nowrap}
.tag b{font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.06em;background:var(--gold);color:var(--royal);padding:calc(var(--u)*4) calc(var(--u)*8)}
.tag i{font-style:normal;font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.06em;color:var(--fg);padding:0 calc(var(--u)*8);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.kl{display:flex;flex-wrap:nowrap;white-space:nowrap;font-family:Anton,Impact,sans-serif;line-height:.98;letter-spacing:.01em;color:var(--fg)}
.kl span{display:inline-block;white-space:pre;text-shadow:0 4px 18px rgba(0,0,0,.55);transform-origin:50% 70%}
.kl .last{color:var(--gold);position:relative}
.kl .last u{position:absolute;left:0;bottom:-.06em;height:.07em;background:var(--gold);text-decoration:none;transform-origin:left center}
.glass{position:relative;width:100%;border-radius:calc(var(--u)*16);padding:calc(var(--u)*16) calc(var(--u)*18);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 18px 40px -16px rgba(0,0,0,.55)}
.glass h3{margin:0 0 calc(var(--u)*10);display:flex;align-items:center;gap:calc(var(--u)*8);font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.08em;color:var(--fg)}
.glass h3:before{content:"";width:calc(var(--u)*8);height:calc(var(--u)*8);border-radius:50%;background:var(--gold)}
.ck{display:flex;align-items:center;gap:calc(var(--u)*12);margin:calc(var(--u)*9) 0;font-weight:600;color:var(--fg)}
.ck svg{flex:none;width:calc(var(--u)*24);height:calc(var(--u)*24);overflow:visible}
.neon{font-family:Anton,Impact,sans-serif;text-align:center;line-height:.95;color:#fff1c2}
.slog{width:100%;border-radius:calc(var(--u)*18);padding:calc(var(--u)*18) calc(var(--u)*18) calc(var(--u)*14);background:color-mix(in srgb,var(--royal) 88%,#fff 4%);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.slog .s1,.slog .s2{font-family:Anton,Impact,sans-serif;line-height:1.05;white-space:nowrap}
.slog .s2{color:var(--gold)}
.slog hr{border:0;height:1px;background:rgba(255,255,255,.3);margin:calc(var(--u)*12) 0 calc(var(--u)*10);transform-origin:left}
.slog .br{font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.1em}
.sl2{margin-top:calc(var(--u)*18);text-align:center;width:100%}
html.ovl,html.ovl body{background:transparent!important}
html.ovl #bg,html.ovl #sweep{display:none}
/* pastille de chapitre (scène page) */
#pill{position:absolute;left:calc(var(--u)*16);bottom:calc(var(--u)*96);display:none;align-items:center;gap:calc(var(--u)*10);padding:calc(var(--u)*9) calc(var(--u)*16) calc(var(--u)*9) calc(var(--u)*12);
  border-radius:calc(var(--u)*14);background:color-mix(in srgb,var(--royal) 93%,transparent);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);box-shadow:0 14px 34px -12px rgba(0,0,0,.55)}
#pill .n{font-family:Anton,Impact,sans-serif;font-size:calc(var(--u)*22);color:var(--gold);line-height:1}
#pill .b{width:2px;height:calc(var(--u)*22);background:var(--gold);opacity:.7}
#pill .t{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:calc(var(--u)*17);letter-spacing:.16em;color:var(--fg);text-transform:uppercase;white-space:nowrap}
/* sous-titres mot à mot (parole du film ou voix off) : cartons de 1 à 3 mots, au tiers bas, au-dessus de tout */
#cap{position:absolute;left:0;right:0;top:69%;display:none;justify-content:center;pointer-events:none;z-index:5}
#cap b{display:inline-block;max-width:88vw;font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;line-height:1.08;text-align:center;white-space:nowrap;
  font-size:calc(var(--u)*27);color:#0b0b0b;background:#ffd400;padding:calc(var(--u)*5) calc(var(--u)*12) calc(var(--u)*4);border-radius:calc(var(--u)*7);box-shadow:0 calc(var(--u)*6) calc(var(--u)*18) rgba(0,0,0,.38)}
</style></head><body>
<div id="root"><div id="bg"></div><div id="sc"></div><div id="sweep"></div></div>
<div id="pill"><span class="n"></span><span class="b"></span><span class="t"></span></div>
<div id="cap"><b></b></div>
<script>
const $ = (s, r = document) => r.querySelector(s), cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const eo = x => 1 - Math.pow(1 - cl(x), 4), eio = x => { x = cl(x); return x < .5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2; };
const ramp = (t, a, b) => cl((t - a) / (b - a)), lerp = (a, b, x) => a + (b - a) * x;
const el = (tag, cls, txt, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (parent) parent.appendChild(e); return e; };   // textContent seulement : aucune balise du scénario n'est interprétée
const fx = (e, o, y = 0, s = 1, x = 0) => { e.style.opacity = o; e.style.transform = `translate3d(${x}px,${y}px,0) scale(${s})`; };
const letters = (row, txt) => [...txt].map(c => el("span", "", c, row));
// réduit la police jusqu'à ce que le texte tienne dans la largeur disponible
const fit = (node, max) => { let f = parseFloat(getComputedStyle(node).fontSize); for (let i = 0; i < 40 && node.scrollWidth > max && f > 8; i++) { f *= .93; node.style.fontSize = f + "px"; } };
const W = () => innerWidth;
// grande ligne (titre de fin, bouton) : une seule ligne réduite si elle tient au-dessus de `min` px, sinon deux lignes équilibrées à `min` px
const fitLine = (node, max, min) => { node.style.whiteSpace = "nowrap"; fit(node, max); if (node.scrollWidth > max || parseFloat(getComputedStyle(node).fontSize) < min) { node.style.fontSize = min + "px"; node.style.whiteSpace = ""; } };
// typographie française : jamais « : », « ? », « % » ou « » » seul en début de ligne ; un nombre « 3 900 000 » ne se coupe pas
const fr = v => String(v || "").replace(/\s+([:;!?»%])/g, "\u00a0$1").replace(/«\s+/g, "«\u00a0").replace(/(\d) (?=\d{3}(?!\d))/g, "$1\u00a0");
// chiffres : décimales gardées (2,5 % ne devient jamais 3 %), séparateur des milliers à partir de 10 000 (une année reste « 1857 »)
const decs = v => { const m = /\.(\d+)/.exec(String(v)); return m ? Math.min(2, m[1].length) : 0; };
const num = (v, d) => (v < 0 ? "\u2212" : "") + Math.abs(v).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: Math.abs(v) >= 1e4 });
// un bloc trop haut pour l'image (texte long en 16:9 ou en carré) est réduit au lieu d'être coupé en haut et en bas
const fitH = (box, u) => { const avail = innerHeight - 56 * u, h = box.scrollHeight; if (h > avail) box.style.zoom = String(Math.max(.45, avail / h)); };
let S = null, A = [], CAPS = [];   // scène courante, éléments animés, cartons de sous-titres
// sous-titres : le carton du moment, entrée rapide (0,12 s) ; texte via textContent, réduit s'il est trop large
const capDraw = (t, u) => {
  const c = $("#cap"), g = CAPS.find(x => t >= x[0] && t < x[1]);
  if (!g) { c.style.display = "none"; return; }
  c.style.display = "flex"; const b = $("b", c);
  if (b.textContent !== g[2]) { b.textContent = g[2]; b.style.fontSize = ""; fit(b, W() - 36 * u); }
  const k = eo(ramp(t, g[0], g[0] + .12)); fx(b, k, (1 - k) * 8 * u, .86 + .14 * k);
};

window.setup = sc => {
  S = sc; A = []; CAPS = Array.isArray(sc.caps) ? sc.caps : []; $("#cap").style.display = "none"; const root = $("#sc"); root.textContent = ""; root.className = ""; root.style.cssText = "";
  const T = sc.type, u = Math.min(innerWidth, innerHeight) / 360;
  if (T === "title") {
    const r1 = el("div", "row an gold", "", root), r2 = el("div", "row an", "", root); r1.style.fontSize = 76 * u + "px"; r2.style.fontSize = 44 * u + "px";
    A.l1 = letters(r1, sc.l1 || ""); const ln = el("div", "ln", "", root); ln.style.margin = `${14 * u}px 0 ${12 * u}px`; A.l2 = letters(r2, sc.l2 || "");
    const sub = el("div", "cd soft", fr(sc.sub), root); sub.style.cssText = `font-size:${15 * u}px;letter-spacing:.42em;margin-top:${14 * u}px;padding-left:.42em;text-wrap:balance`;
    fit(r1, W() - 48 * u); fit(r2, W() - 48 * u); fit(sub, W() - 48 * u); A.ln = ln; A.sub = sub; if (!sc.l2) { r2.style.display = "none"; ln.style.display = "none"; }
  } else if (T === "text") {
    const box = el("div", "tx", "", root); const h = sc.heading ? el("h2", "an", fr(sc.heading), box) : null; A.h = h;
    A.b = sc.bullets.map(b => { const d = el("div", "bl", "", box); el("i", "", "", d); el("span", "", fr(b), d); return d; }); fitH(box, u);
  } else if (T === "photo" || T === "gallery") {
    root.style.padding = "0"; const srcs = T === "photo" ? [sc.src] : sc.srcs;
    A.p = srcs.map(s => { const w = el("div", "ph", "", root), im = el("img", "", "", w); im.src = s; im.decoding = "sync"; return { w, im }; });
    el("div", "shade", "", root);
    if (sc.caption) { const c = el("div", "cap", "", root); A.cap = el("span", "", fr(sc.caption), c); }
  } else if (T === "stats") {
    const g = el("div", "gr", "", root); A.c = sc.items.map(it => { const c = el("div", "cd2", "", g), b = el("b", "", "", c); el("small", "", fr(it.label), c); return { c, b, it, d: decs(it.value) }; });
    A.c.forEach(o => { o.b.textContent = num(o.it.value, o.d) + (o.it.suffix || ""); o.b.style.whiteSpace = "nowrap"; fit(o.b, o.c.clientWidth - 24 * u); });
    const fs = Math.min(...A.c.map(o => parseFloat(getComputedStyle(o.b).fontSize))); A.c.forEach(o => { o.b.style.fontSize = fs + "px"; }); fitH(g, u); A.c.forEach(o => { o.b.textContent = ""; });   // même taille pour tous les chiffres   // la police s'adapte au chiffre FINAL (« 80 km/h » ne déborde pas de la carte)
  } else if (T === "quote") {
    const box = el("div", "fit", "", root); el("div", "qm", "“", box); const q = el("div", "qt", "", box);
    A.w = fr(sc.text).split(/[ \t\n]+/).filter(Boolean).map(w => el("span", "", w + " ", q)); A.a = sc.author ? el("div", "qa cd", "— " + fr(sc.author), box) : null; fitH(box, u);
  } else if (T === "outro") {
    const L = sc.lines || [], box = el("div", "fit", "", root), mk = (i, cls, tag = "div") => L[i] ? el(tag, cls, fr(L[i]), box) : null;
    A.e = [mk(0, "e1 an"), mk(1, "e2 an"), L[0] ? el("div", "ln", "", box) : null, mk(2, "e3 cd"), mk(3, "e4 cd"), mk(4, "e5"), mk(5, "e6")].filter(Boolean);
    A.e.forEach((e, i) => { if (e.classList.contains("ln")) e.style.margin = `${14 * u}px 0 ${6 * u}px`; if (e.classList.contains("e3")) e.style.margin = `${12 * u}px 0 ${20 * u}px`; if (e.classList.contains("e5")) e.style.marginTop = `${20 * u}px`; if (e.classList.contains("e6")) e.style.marginTop = `${6 * u}px`;
      const mins = { e1: 34, e2: 20, e4: 14 }, k = Object.keys(mins).find(c => e.classList.contains(c));
      if (k) fitLine(e, W() - 48 * u, mins[k] * u); else fit(e, W() - 48 * u); }); fitH(box, u);
  } else if (["typewriter", "kinetic", "checklist", "neon", "slogan"].includes(T)) {
    fxSetup(sc, root, u);
  }
};
const FONTS = ["400 40px 'Special Elite'", "400 40px Anton", "500 20px Barlow", "600 20px Barlow", "600 20px 'Barlow Condensed'", "700 20px 'Barlow Condensed'"];
window.fontsOk = async () => {   // rend la liste des polices manquantes (vide = tout est là)
  await Promise.all(FONTS.map(f => document.fonts.load(f).catch(() => null)));
  const miss = FONTS.filter(f => !document.fonts.check(f));
  return [...document.fonts].some(f => /Anton/.test(f.family)) ? miss : ["feuille des polices"];
};
window.ready = async () => {      // rend la liste des images qui n'ont pas pu être chargées (vide = tout est là)
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => 0)));
  return [...document.images].filter(i => !i.naturalWidth).map(i => i.src);
};
window.reloadImages = () => { for (const i of document.images) if (!i.naturalWidth) { const s = i.src; i.removeAttribute("src"); i.src = s; } };

const kb = (p, t, dur, dir, i = 0) => {   // Ken Burns : zoom lent + dérive
  const k = ramp(t, 0, dur), z = dir === "out" ? lerp(1.16, 1.02, k) : lerp(1.02, 1.16, k), dx = dir === "left" ? lerp(3, -3, k) : dir === "right" ? lerp(-3, 3, k) : lerp(-1.2, 1.2, k) * (i % 2 ? -1 : 1);
  p.im.style.transform = `translate3d(${dx}%,${lerp(1, -1, k)}%,0) scale(${z})`; };

// t = temps dans la scène (s) ; dur = durée de la scène (s)
window.draw = (t, dur) => {
  const sc = S, T = sc.type, u = Math.min(innerWidth, innerHeight) / 360, root = $("#root");
  $("#bg").style.transform = `translate3d(${Math.sin(t * .5) * 2}%,${Math.cos(t * .4) * 2}%,0) scale(1.1)`;
  $("#sweep").style.opacity = 0;
  if (T === "title") {
    A.l1.forEach((s, i) => { const k = eo(ramp(t, .15 + i * .07, .75 + i * .07)); fx(s, k, (1 - k) * 80 * u); });
    A.l2.forEach((s, i) => { const k = eo(ramp(t, .45 + i * .04, 1 + i * .04)); fx(s, k, (1 - k) * 50 * u); });
    A.ln.style.transform = `scaleX(${eo(ramp(t, .35, 1.05))})`; const ks = eo(ramp(t, .95, 1.5)); fx(A.sub, ks, (1 - ks) * 12 * u);
