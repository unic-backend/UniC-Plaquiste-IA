name: Manual merge policy

# La fusion reste une décision explicite du propriétaire du dépôt.
# Aucun workflow ne doit activer la fusion automatique des pull requests.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  manual-merge-policy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Rappel de politique
        run: echo "Auto-merge is disabled. The repository owner reviews and merges pull requests manually."
