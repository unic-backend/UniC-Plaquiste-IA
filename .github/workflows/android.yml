name: Android APK

on:
  push:
    paths: ["frontend/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Voice model for "Hey UniC" (offline keyword spotting, checked by hash)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/vosk-fr.zip" https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip
          echo "cabf6180e177eb9b3a9a9d43a437bd5e549f3a7d09525e5d69a3fed787be12ad  $RUNNER_TEMP/vosk-fr.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/vosk-fr.zip" -d "$RUNNER_TEMP/vosk"
          mkdir -p android/app/src/main/assets
          mv "$RUNNER_TEMP/vosk/vosk-model-small-fr-0.22" android/app/src/main/assets/model-fr
      - name: Unit tests (Android)
        working-directory: frontend/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: unic-ai-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
